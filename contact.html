<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="contact.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Fond animé -->
    <div class="bg-animated"></div>

    <!-- Navbar -->
    <nav class="fixed w-full top-0 left-0 py-6">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold">
                Alexandre<span style="color: #5D82EE;">.</span>
            </h1>
            <ul class="flex space-x-8">
                <li><a href="index.html" class="hover:text-blue-500">Accueil</a></li>
                <li><a href="proj.html" class="hover:text-blue-500">Projets</a></li>
                <li><a href="Iam.html" class="hover:text-blue-500">À Propos</a></li>
                <li><a href="contact.html" class="hover:text-blue-500 active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Section de contact -->
    <div class="contact-container">
        <h1>Me Contacter</h1>
        <form>
            <label for="name">Nom complet</label>
            <input type="text" id="name" name="name" placeholder="Votre nom" required>
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" placeholder="Votre email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Votre message" rows="5" required></textarea>
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Mon Portfolio. Tous droits réservés. <a href="https://www.linkedin.com" target="_blank">LinkedIn</a> | <a href="https://github.com" target="_blank">GitHub</a></p>
    </footer>

</body>
</html>
